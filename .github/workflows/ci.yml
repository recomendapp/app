name: CI Pipeline

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: 🧪 Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: ⚙️ Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧠 Initialize Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: 🧹 Run Lint (Affected)
        run: pnpm nx affected -t lint --parallel=3

      - name: 🧪 Run Tests (Affected)
        run: pnpm nx affected -t test --parallel=3

      - name: 🏗️ Check Build (Affected)
        run: pnpm nx affected -t build --parallel=3
