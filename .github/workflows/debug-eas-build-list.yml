name: 🩺 Debug EAS build:list output

on:
  workflow_dispatch:

jobs:
  debug:
    name: 🩺 Capture raw build:list output
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: ⚙️ Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.INFISICAL_EXPO_TOKEN }}

      - name: 📝 Prepare Environment Files
        run: |
          cat <<EOF > apps/mobile/.env
          APP_VARIANT=production
          EXPO_PUBLIC_API_URL="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_API_URL }}"
          EXPO_PUBLIC_WEB_APP="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_WEB_APP }}"
          EXPO_PUBLIC_FACEBOOK_APP_ID="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_FACEBOOK_APP_ID }}"
          EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN }}"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}"
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}"
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}"
          EXPO_PUBLIC_SENTRY_DSN="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_SENTRY_DSN }}"
          SENTRY_AUTH_TOKEN="${{ secrets.INFISICAL_MOBILE_SENTRY_AUTH_TOKEN }}"
          SENTRY_ORG="${{ secrets.INFISICAL_MOBILE_SENTRY_ORG }}"
          SENTRY_PROJECT="${{ secrets.INFISICAL_MOBILE_SENTRY_PROJECT }}"
          SENTRY_DISABLE_AUTO_UPLOAD="${{ secrets.INFISICAL_MOBILE_SENTRY_DISABLE_AUTO_UPLOAD }}"
          TMDB_IMAGE_BASE_URL="${{ secrets.INFISICAL_MOBILE_TMDB_IMAGE_BASE_URL }}"
          EOF

      - name: 🔑 Decode google-services.json
        run: |
          echo "${{ secrets.INFISICAL_MOBILE_GOOGLE_SERVICES_ANDROID_BASE64 }}" | base64 --decode > apps/mobile/google-services.json

      - name: 🩺 Show which env vars actually made it into .env (names only, no values)
        working-directory: apps/mobile
        run: |
          echo "--- keys present in .env (values redacted) ---"
          sed 's/=.*/=<redacted>/' .env
          echo "--- any of these secrets literally empty at the GH Actions level? (true/false) ---"
          echo "EXPO_PUBLIC_FACEBOOK_APP_ID empty: $([ -z "${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_FACEBOOK_APP_ID }}" ] && echo true || echo false)"

      - name: 🩺 Run npx expo config directly (bypassing eas-cli entirely)
        working-directory: apps/mobile
        run: |
          set +e
          npx expo config --json > /tmp/expo-config.stdout 2> /tmp/expo-config.stderr
          echo "npx expo config exit code: $?"
          echo "::group::npx expo config stderr"
          cat /tmp/expo-config.stderr
          echo "::endgroup::"
          echo "::group::npx expo config stdout (first 2000 chars)"
          head -c 2000 /tmp/expo-config.stdout
          echo "::endgroup::"

      - name: 🩺 Capture raw pnpm exec eas output (no build triggered)
        working-directory: apps/mobile
        run: |
          set +e
          pnpm exec eas build:list --platform android --build-profile production --limit 1 --non-interactive --json > /tmp/raw.stdout 2> /tmp/raw.stderr
          echo "exit code: $?"
          echo "::group::stdout (cat -A, shows control chars)"
          cat -A /tmp/raw.stdout
          echo "::endgroup::"
          echo "::group::stderr (cat -A)"
          cat -A /tmp/raw.stderr
          echo "::endgroup::"
          echo "::group::stdout hexdump (first 400 bytes)"
          head -c 400 /tmp/raw.stdout | xxd
          echo "::endgroup::"
          echo "::group::jq parse attempt"
          jq -r '.[0].status' /tmp/raw.stdout || echo "jq failed with exit $?"
          echo "::endgroup::"

      - name: 💾 Upload raw output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eas-build-list-raw-output
          path: |
            /tmp/raw.stdout
            /tmp/raw.stderr
            /tmp/expo-config.stdout
            /tmp/expo-config.stderr
          retention-days: 7

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f apps/mobile/.env
          rm -f apps/mobile/google-services.json
