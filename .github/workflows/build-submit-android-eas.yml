name: Build and Submit Android (EAS Cloud)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_fingerprint_save:
        description: 'Set by Mobile Router, which already saves fingerprints itself after all builds finish'
        type: boolean
        required: false
        default: false

jobs:
  build-android:
    name: 🤖 Build & Submit Android (EAS Cloud)
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: ⚙️ Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.INFISICAL_EXPO_TOKEN }}

      - name: 📝 Prepare Environment Files
        run: |
          cat <<EOF > apps/mobile/.env
          APP_VARIANT=production
          EXPO_PUBLIC_API_URL="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_API_URL }}"
          EXPO_PUBLIC_WEB_APP="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_WEB_APP }}"
          EXPO_PUBLIC_FACEBOOK_APP_ID="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_FACEBOOK_APP_ID }}"
          EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN }}"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}"
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}"
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}"
          EXPO_PUBLIC_SENTRY_DSN="${{ secrets.INFISICAL_MOBILE_EXPO_PUBLIC_SENTRY_DSN }}"
          SENTRY_AUTH_TOKEN="${{ secrets.INFISICAL_MOBILE_SENTRY_AUTH_TOKEN }}"
          SENTRY_ORG="${{ secrets.INFISICAL_MOBILE_SENTRY_ORG }}"
          SENTRY_PROJECT="${{ secrets.INFISICAL_MOBILE_SENTRY_PROJECT }}"
          SENTRY_DISABLE_AUTO_UPLOAD="${{ secrets.INFISICAL_MOBILE_SENTRY_DISABLE_AUTO_UPLOAD }}"
          TMDB_IMAGE_BASE_URL="${{ secrets.INFISICAL_MOBILE_TMDB_IMAGE_BASE_URL }}"
          EOF

      - name: 📝 Prepare API Environment Files
        run: |
          # Api
          cat <<EOF > apps/api/.env
          NODE_ENV=production
          AUTH_SECRET="${{ secrets.INFISICAL_AUTH_SECRET }}"
          API_URL="${{ secrets.INFISICAL_API_URL }}"
          AUTH_GOOGLE_CLIENT_ID="${{ secrets.INFISICAL_AUTH_GOOGLE_CLIENT_ID }}"
          AUTH_GOOGLE_IOS_CLIENT_ID="${{ secrets.INFISICAL_AUTH_GOOGLE_IOS_CLIENT_ID }}"
          AUTH_GOOGLE_ANDROID_CLIENT_ID="${{ secrets.INFISICAL_AUTH_GOOGLE_ANDROID_CLIENT_ID }}"
          AUTH_GOOGLE_CLIENT_SECRET="${{ secrets.INFISICAL_AUTH_GOOGLE_CLIENT_SECRET }}"
          AUTH_GITHUB_CLIENT_ID="${{ secrets.INFISICAL_AUTH_GITHUB_CLIENT_ID }}"
          AUTH_GITHUB_CLIENT_SECRET="${{ secrets.INFISICAL_AUTH_GITHUB_CLIENT_SECRET }}"
          AUTH_FACEBOOK_CLIENT_ID="${{ secrets.INFISICAL_AUTH_FACEBOOK_CLIENT_ID }}"
          AUTH_FACEBOOK_CLIENT_SECRET="${{ secrets.INFISICAL_AUTH_FACEBOOK_CLIENT_SECRET }}"
          AUTH_APPLE_CLIENT_ID="${{ secrets.INFISICAL_AUTH_APPLE_CLIENT_ID }}"
          AUTH_APPLE_TEAM_ID="${{ secrets.INFISICAL_AUTH_APPLE_TEAM_ID }}"
          AUTH_APPLE_KEY_ID="${{ secrets.INFISICAL_AUTH_APPLE_KEY_ID }}"
          AUTH_APPLE_PRIVATE_KEY="${{ secrets.INFISICAL_AUTH_APPLE_PRIVATE_KEY }}"
          AUTH_APPLE_BUNDLE_ID="${{ secrets.INFISICAL_AUTH_APPLE_BUNDLE_ID }}"
          REVENUECAT_API_KEY="${{ secrets.INFISICAL_REVENUECAT_API_KEY }}"
          REVENUECAT_WEBHOOK_SECRET="${{ secrets.INFISICAL_REVENUECAT_WEBHOOK_SECRET }}"
          DATABASE_URL="postgres://localhost:5432/placeholder"
          ASSETS_BASE_URL="https://assets.example.com"
          S3_ENDPOINT="https://s3.example.com"
          S3_ACCESS_KEY_ID="placeholder"
          S3_SECRET_ACCESS_KEY="placeholder"
          TYPESENSE_HOST="localhost"
          TYPESENSE_API_KEY="placeholder"
          PREFECT_API_URL="https://prefect.example.com/api"
          PREFECT_API_AUTH_STRING="placeholder"
          API_INTERNAL_IMPORTS_SECRET="placeholder"
          EOF

      - name: 🔑 Decode google-services.json
        env:
          GOOGLE_SERVICES_ANDROID_BASE64: ${{ secrets.INFISICAL_MOBILE_GOOGLE_SERVICES_ANDROID_BASE64 }}
        run: |
          echo $GOOGLE_SERVICES_ANDROID_BASE64 | base64 --decode > apps/mobile/google-services.json

      - name: ☁️ EAS Build (via Nx, EAS Cloud)
        timeout-minutes: 300
        run: pnpm nx build mobile --platform android --profile production --non-interactive

      - name: ✅ Verify Build Actually Finished
        working-directory: apps/mobile
        run: |
          # eas-cli resolves app.config.ts locally to read the project id, and
          # explicitly sets EXPO_NO_DOTENV=1 when it does so (it expects env
          # vars for that to come from EAS's own "environment" system on the
          # build server, not a local .env file) - see
          # node_modules/eas-cli/build/project/expoConfig.js. Since our
          # app.config.ts plugins read process.env.EXPO_PUBLIC_FACEBOOK_APP_ID
          # directly, and .env here is only ever a file (never exported), that
          # resolution fails with "missing appID in the plugin properties",
          # and eas-cli prints that failure - not JSON - to stdout, which is
          # what was actually breaking the jq parse below. Export .env's vars
          # into the real environment so eas-cli's local config resolution
          # has them, same as the EAS Cloud build server does for the actual
          # build.
          set -a
          source .env
          set +a
          STATUS=$(pnpm exec eas build:list --platform android --build-profile production --limit 1 --non-interactive --json | jq -r '.[0].status')
          echo "Latest Android build status: $STATUS"
          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::Android build did not finish (status: $STATUS) — failing this job so the self-hosted fallback can take over."
            exit 1
          fi

      - name: 🚀 EAS Submit (via Nx)
        run: pnpm nx submit mobile --platform android --profile production --latest --non-interactive --no-wait

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f apps/mobile/.env
          rm -f apps/api/.env
          rm -f apps/mobile/google-services.json

  save-fingerprint:
    name: 💾 Save Fingerprint
    needs: build-android
    # Skipped when Mobile Router calls this workflow: it already saves both
    # platforms' fingerprints itself in a single job, to avoid two parallel
    # Save Fingerprint runs racing to push to main. github.event_name can't
    # be used to detect that here (it's inherited from whatever triggered
    # the caller, not set to 'workflow_call'), so Mobile Router passes this
    # input explicitly instead.
    if: inputs.skip_fingerprint_save != true
    uses: ./.github/workflows/save-fingerprint.yml
    with:
      platform: android
    secrets: inherit
